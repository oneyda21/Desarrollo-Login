<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #ff7eb3, #ff758c, #ff8e72);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        .contenedor {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
        }
        .tarjeta {
            background: #fff;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.3);
            padding: 30px;
            border-radius: 15px;
            width: 380px;
            text-align: center;
            transition: transform 0.3s;
        }
        .tarjeta:hover {
            transform: scale(1.05);
        }
        .tarjeta h3 {
            color: #333;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .form-control {
            border-radius: 25px;
            border: 2px solid #ff758c;
            padding: 10px;
        }
        .form-control:focus {
            border-color: #ff8e72;
            box-shadow: 0 0 10px rgba(255, 120, 90, 0.5);
        }
        .btn-personalizado {
            background: linear-gradient(135deg, #ff758c, #ff8e72);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .btn-personalizado:hover {
            background: linear-gradient(135deg, #ff8e72, #ff758c);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="tarjeta">
            <h3>Iniciar sesión</h3>
            <div class="mb-3">
                <label for="email" class="form-label">Dirección de correo electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="Contraseña">
            </div>
            <div class="text-center">
                <button class="btn btn-personalizado">Iniciar sesión</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
